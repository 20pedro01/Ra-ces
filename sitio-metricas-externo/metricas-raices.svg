<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      .text-font { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo Principal con bordes redondeados -->
  <rect width="800" height="340" rx="28" fill="url(#bgGrad)"/>

  <!-- Encabezado Superior -->
  <g transform="translate(40, 38)">
    <!-- Badge Validación -->
    <rect width="175" height="26" rx="13" fill="#334155"/>
    <circle cx="14" cy="13" r="4" fill="#4ade80"/>
    <text x="26" y="17" fill="#cbd5e1" font-size="11" font-weight="700" class="text-font" letter-spacing="0.5">VALIDACIÓN EN CAMPO</text>

    <!-- Título -->
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="800" class="text-font">Monitor de Demanda y Métricas · Raíces</text>
    
    <!-- Tagline / Fuente -->
    <text x="720" y="52" fill="#94a3b8" font-size="12" font-weight="600" class="text-font" text-anchor="end">Demanda real MVP</text>
  </g>

  <!-- Tarjeta 1: Total Visitantes (Azul Cenote) -->
  <g transform="translate(40, 115)" filter="url(#cardShadow)">
    <rect width="340" height="180" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Acento superior azul -->
    <path d="M 0 20 Q 0 0 20 0 L 320 0 Q 340 0 340 20 L 340 5 L 0 5 Z" fill="#0284c7"/>
    
    <!-- Ícono Azul -->
    <rect x="276" y="24" width="40" height="40" rx="12" fill="#0284c7" fill-opacity="0.18"/>
    <!-- Persona SVG path -->
    <circle cx="296" cy="39" r="5.5" fill="#38bdf8"/>
    <path d="M287 55 C287 48 291 47 296 47 C301 47 305 48 305 55" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Textos -->
    <text x="26" y="44" fill="#94a3b8" font-size="13" font-weight="700" class="text-font" text-transform="uppercase" letter-spacing="0.5">TOTAL VISITANTES</text>
    <text x="26" y="100" fill="#38bdf8" font-size="48" font-weight="800" class="text-font">15</text>
    <text x="26" y="130" fill="#cbd5e1" font-size="12" font-weight="500" class="text-font">Personas que abrieron el enlace (sin registro)</text>

    <!-- Badge footer -->
    <rect x="26" y="144" width="105" height="22" rx="11" fill="#0284c7" fill-opacity="0.2"/>
    <text x="78" y="159" fill="#38bdf8" font-size="11" font-weight="700" class="text-font" text-anchor="middle">Tráfico directo</text>
  </g>

  <!-- Tarjeta 2: Intención de Compra (Verde Selva) -->
  <g transform="translate(420, 115)" filter="url(#cardShadow)">
    <rect width="340" height="180" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Acento superior verde -->
    <path d="M 0 20 Q 0 0 20 0 L 320 0 Q 340 0 340 20 L 340 5 L 0 5 Z" fill="#15803d"/>
    
    <!-- Ícono Verde -->
    <rect x="276" y="24" width="40" height="40" rx="12" fill="#15803d" fill-opacity="0.22"/>
    <!-- Carrito SVG -->
    <circle cx="291" cy="53" r="2.8" fill="#4ade80"/>
    <circle cx="303" cy="53" r="2.8" fill="#4ade80"/>
    <path d="M283 34 L287 34 L292 48 L305 48 L309 39 L289 39" stroke="#4ade80" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Textos -->
    <text x="26" y="44" fill="#94a3b8" font-size="13" font-weight="700" class="text-font" text-transform="uppercase" letter-spacing="0.5">INTENCIÓN DE COMPRA</text>
    <text x="26" y="100" fill="#4ade80" font-size="48" font-weight="800" class="text-font">7</text>
    <text x="26" y="130" fill="#cbd5e1" font-size="12" font-weight="500" class="text-font">Personas que llegaron a la etapa de pago</text>

    <!-- Badge footer -->
    <rect x="26" y="144" width="105" height="22" rx="11" fill="#15803d" fill-opacity="0.25"/>
    <text x="78" y="159" fill="#4ade80" font-size="11" font-weight="700" class="text-font" text-anchor="middle">Demanda real</text>
  </g>

</svg>
