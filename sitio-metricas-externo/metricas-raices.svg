<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      .text-font { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c4629"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3e2719" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Fondo General (Cálido y Elegante #fbf9f6) -->
  <rect width="820" height="460" rx="24" fill="#fbf9f6" stroke="#e6e0d8" stroke-width="1.5"/>

  <!-- Encabezado Blanco con Acento Tricolor -->
  <g transform="translate(30, 24)" filter="url(#softShadow)">
    <rect width="760" height="132" rx="18" fill="#ffffff" stroke="#e6e0d8" stroke-width="1"/>
    
    <!-- Barra superior tricolor -->
    <path d="M 0 14 Q 0 0 14 0 L 746 0 Q 760 0 760 14 L 760 4 L 0 4 Z" fill="url(#tricolor)"/>

    <!-- Badge Centrado: Validación del MVP -->
    <rect x="300" y="16" width="160" height="24" rx="12" fill="#faf5ee" stroke="#ebd9c8" stroke-width="1"/>
    <circle cx="314" cy="28" r="4" fill="#15803d"/>
    <text x="380" y="32" fill="#3e2719" font-size="11" font-weight="700" class="text-font" text-anchor="middle">Validación del MVP</text>

    <!-- Título Principal -->
    <text x="380" y="66" fill="#3e2719" font-size="22" font-weight="800" class="text-font" text-anchor="middle">Visitas y demanda</text>

    <!-- Subtítulo -->
    <text x="380" y="86" fill="#6b635b" font-size="12" font-weight="500" class="text-font" text-anchor="middle">
      Seguimiento en tiempo real de visitantes e intención de compra de <tspan font-weight="700" fill="#3e2719">Raíces</tspan>.
    </text>

    <!-- Barra de Estado: En línea · Datos al día -->
    <rect x="305" y="99" width="150" height="22" rx="11" fill="#faf5ee" stroke="#ebd9c8" stroke-width="1"/>
    <circle cx="320" cy="110" r="3.5" fill="#15803d"/>
    <text x="380" y="114" fill="#6b635b" font-size="10.5" font-weight="600" class="text-font" text-anchor="middle">En línea · Datos al día</text>
  </g>

  <!-- Tarjeta 1: Total de visitantes (Azul Cenote) -->
  <g transform="translate(30, 174)" filter="url(#softShadow)">
    <rect width="370" height="195" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <path d="M 0 14 Q 0 0 14 0 L 356 0 Q 370 0 370 14 L 370 4 L 0 4 Z" fill="#0284c7"/>

    <!-- Encabezado de la tarjeta -->
    <text x="170" y="35" fill="#6b635b" font-size="13" font-weight="700" class="text-font" text-anchor="middle">Total de visitantes</text>
    <rect x="242" y="18" width="30" height="30" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <!-- Icono Personas -->
    <circle cx="257" cy="30" r="4" fill="#0284c7"/>
    <path d="M250 42 C250 37 253 36 257 36 C261 36 264 37 264 42" stroke="#0284c7" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Valor principal -->
    <text x="185" y="96" fill="#0284c7" font-size="44" font-weight="800" class="text-font" text-anchor="middle">89</text>

    <!-- Descripción -->
    <text x="185" y="130" fill="#6b635b" font-size="12" font-weight="500" class="text-font" text-anchor="middle">Personas que abrieron el enlace.</text>

    <!-- Badge footer -->
    <rect x="130" y="156" width="110" height="22" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="185" y="171" fill="#0284c7" font-size="11" font-weight="600" class="text-font" text-anchor="middle">Tráfico directo</text>
  </g>

  <!-- Tarjeta 2: Intención de compra (Verde Selva) -->
  <g transform="translate(420, 174)" filter="url(#softShadow)">
    <rect width="370" height="195" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <path d="M 0 14 Q 0 0 14 0 L 356 0 Q 370 0 370 14 L 370 4 L 0 4 Z" fill="#15803d"/>

    <!-- Encabezado de la tarjeta -->
    <text x="170" y="35" fill="#6b635b" font-size="13" font-weight="700" class="text-font" text-anchor="middle">Intención de compra</text>
    <rect x="245" y="18" width="30" height="30" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <!-- Icono Carrito -->
    <circle cx="256" cy="42" r="1.8" fill="#15803d"/>
    <circle cx="264" cy="42" r="1.8" fill="#15803d"/>
    <path d="M250 28 L253 28 L256 38 L265 38 L268 31 L254 31" stroke="#15803d" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Valor principal con número y porcentaje -->
    <text x="185" y="96" class="text-font" text-anchor="middle">
      <tspan fill="#15803d" font-size="44" font-weight="800">32</tspan>
      <tspan fill="#15803d" font-size="22" font-weight="700" dx="6">(36.0%)</tspan>
    </text>

    <!-- Descripción -->
    <text x="185" y="130" fill="#6b635b" font-size="12" font-weight="500" class="text-font" text-anchor="middle">Personas que llegaron a la etapa de cobro</text>

    <!-- Badge footer -->
    <rect x="130" y="156" width="110" height="22" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="185" y="171" fill="#15803d" font-size="11" font-weight="600" class="text-font" text-anchor="middle">Demanda real</text>
  </g>

  <!-- Fuente de Datos y Última Sincronización (Centrado al fondo) -->
  <g transform="translate(190, 388)" filter="url(#softShadow)">
    <rect width="440" height="52" rx="14" fill="#ffffff" stroke="#e6e0d8" stroke-width="1"/>
    
    <!-- Icono Globo / API centrado con el título -->
    <circle cx="126" cy="20" r="9" fill="#faf5ee" stroke="#ebd9c8" stroke-width="1"/>
    <circle cx="126" cy="20" r="4.5" fill="none" stroke="#6c4629" stroke-width="1.2"/>
    <line x1="117" y1="20" x2="135" y2="20" stroke="#6c4629" stroke-width="1.2"/>
    
    <text x="143" y="24" fill="#3e2719" font-size="12" font-weight="700" class="text-font">Fuente de datos (API endpoint)</text>
    <text x="220" y="40" fill="#6b635b" font-size="10.5" font-weight="500" class="text-font" text-anchor="middle">Última sincronización: 06/09/2026, 11:11 a.m. (Hora Mérida)</text>
  </g>

</svg>
